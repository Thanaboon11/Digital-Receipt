<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Life Magic Countdown</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Anuphan', sans-serif; background: #fdfbfb; }
        
        /* สไตล์การ์ดแยกตามสีสดใส */
        .bg-gradient-pink { background: linear-gradient(135deg, #FF5F6D 0%, #FFC371 100%); }
        .bg-gradient-blue { background: linear-gradient(135deg, #2193b0 0%, #6dd5ed 100%); }
        .bg-gradient-orange { background: linear-gradient(135deg, #f12711 0%, #f5af19 100%); }
        .bg-gradient-green { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        
        /* ลูกเล่นปุ่มกดนูน 3D */
        .btn-push {
            box-shadow: 0 4px 0 #4338ca;
            transition: all 0.1s;
        }
        .btn-push:active {
            box-shadow: 0 0px 0 #4338ca;
            transform: translateY(4px);
        }
        
        .card-shadow { box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-5xl mx-auto">
        <div class="text-center mb-10">
            <h1 class="text-5xl font-extrabold mb-2 italic tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-pink-500">
                MY MAGIC DAY 🌈
            </h1>
            <p class="text-gray-400 font-bold uppercase tracking-widest text-xs">อย่าพลาดทุกวินาทีสำคัญ!</p>
        </div>

        <div class="bg-white p-8 rounded-[40px] card-shadow mb-12 border-4 border-indigo-50">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <div class="md:col-span-2">
                    <label class="block text-gray-400 text-xs font-black mb-2 ml-2">ชื่อเรื่องสุดตื่นเต้น</label>
                    <input type="text" id="eventTitle" placeholder="เช่น ไปเทรดทองที่ MTS-GOLD" 
                           class="w-full p-4 bg-gray-100 rounded-2xl border-none font-bold text-gray-700 outline-none focus:ring-4 focus:ring-indigo-200 transition">
                </div>
                <div>
                    <label class="block text-gray-400 text-xs font-black mb-2 ml-2">เลือกโหมด</label>
                    <select id="eventCat" class="w-full p-4 bg-gray-100 rounded-2xl border-none font-bold text-gray-700 outline-none">
                        <option value="🎂">🎂 วันเกิด (ชมพู)</option>
                        <option value="🏥">🏥 นัดหมอ (ฟ้า)</option>
                        <option value="💻">💻 ส่งงาน (ส้ม)</option>
                        <option value="📌">📌 ทั่วไป (เขียว)</option>
                    </select>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-gray-400 text-xs font-black mb-2 ml-2">วันและเวลา</label>
                    <input type="datetime-local" id="eventDate" class="w-full p-4 bg-gray-100 rounded-2xl border-none font-bold outline-none">
                </div>
                <div class="md:col-span-2 flex items-end">
                    <button id="addBtn" class="btn-push w-full bg-indigo-600 text-white font-black p-4 rounded-2xl text-xl hover:bg-indigo-500">
                        บันทึกเล้ยยย! 🚀
                    </button>
                </div>
            </div>
        </div>

        <div id="countdownList" class="grid grid-cols-1 md:grid-cols-2 gap-8">
            </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // *** วาง Config ของคุณตรงนี้ ***
       const firebaseConfig = {
  apiKey: "AIzaSyDxm5hucIGKQPSl0VQzlbPLfimCLR_WCFA",
  authDomain: "personal-countdown-202de.firebaseapp.com",
  projectId: "personal-countdown-202de",
  storageBucket: "personal-countdown-202de.firebasestorage.app",
  messagingSenderId: "689677907000",
  appId: "1:689677907000:web:aafe63dfcf086ecd81e2cd",
  measurementId: "G-DJK85WMLBF"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const colRef = collection(db, "countdowns");

        function getGradient(cat) {
            if (cat === '🎂') return 'bg-gradient-pink';
            if (cat === '🏥') return 'bg-gradient-blue';
            if (cat === '💻') return 'bg-gradient-orange';
            return 'bg-gradient-green';
        }

        onSnapshot(query(colRef, orderBy("target_date", "asc")), (snapshot) => {
            const list = document.getElementById('countdownList');
            list.innerHTML = '';
            
            snapshot.forEach((doc) => {
                const data = doc.data();
                const diff = data.target_date - Date.now();
                const isOver = diff < 0;
                const d = Math.floor(Math.abs(diff) / (1000*60*60*24));
                const h = Math.floor((Math.abs(diff) / (1000*60*60)) % 24);

                const card = document.createElement('div');
                card.className = `p-8 rounded-[40px] text-white card-shadow relative overflow-hidden group hover:scale-105 transition-transform ${getGradient(data.category)}`;
                card.innerHTML = `
                    <div class="absolute -right-4 -top-4 text-8xl opacity-20 group-hover:rotate-12 transition-transform">${data.category}</div>
                    <div class="relative z-10">
                        <div class="flex justify-between items-start">
                            <h3 class="text-3xl font-black drop-shadow-lg mb-1">${data.title}</h3>
                            <button onclick="deleteEvent('${doc.id}')" class="bg-white/20 hover:bg-white/40 p-2 rounded-full text-xs font-bold transition">ลบ</button>
                        </div>
                        <p class="text-white/80 font-bold mb-6">${new Date(data.target_date).toLocaleDateString('th-TH', {dateStyle:'full'})}</p>
                        
                        <div class="flex items-center gap-4">
                            <div class="text-center">
                                <span class="block text-6xl font-black tracking-tighter leading-none">${d}</span>
                                <span class="text-xs font-bold uppercase tracking-widest opacity-80">Days</span>
                            </div>
                            <div class="h-10 w-1 bg-white/30 rounded-full"></div>
                            <div class="text-center">
                                <span class="block text-6xl font-black tracking-tighter leading-none">${h}</span>
                                <span class="text-xs font-bold uppercase tracking-widest opacity-80">Hours</span>
                            </div>
                        </div>
                        
                        <div class="mt-6">
                            <span class="bg-black/20 px-4 py-1 rounded-full text-xs font-black uppercase tracking-widest border border-white/20">
                                ${isOver ? '⏱️ จบกิจกรรมแล้ว' : '🔥 กำลังจะมาถึง'}
                            </span>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
        });

        window.deleteEvent = (id) => { if(confirm('จะลบทิ้งจริงเหรอ? 🥺')) deleteDoc(doc(db, "countdowns", id)); };
        
        document.getElementById('addBtn').onclick = async () => {
            const title = document.getElementById('eventTitle').value;
            const date = document.getElementById('eventDate').value;
            const cat = document.getElementById('eventCat').value;
            if (title && date) {
                await addDoc(colRef, { title, target_date: new Date(date).getTime(), category: cat });
                document.getElementById('eventTitle').value = '';
            } else {
                alert('ใส่อะไรลงไปหน่อยน้าาา ✍️');
            }
        };
    </script>
</body>
</html>
